[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-backend"
version = "0.1.0"
description = "CORE Python Backend — FastAPI server replacing NestJS middleware"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=15.0.0",
    "aiosqlite>=0.21.0",
    "pydantic>=2.0.0",
    "pycer==0.1.6",
]

[project.scripts]
core-backend = "core_backend.__main__:main"

[tool.uv.sources]

[dependency-groups]
dev = [
    "basedpyright>=1.39.8",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B904", "SIM105", "UP046"]

[tool.basedpyright]
typeCheckingMode = "strict"
